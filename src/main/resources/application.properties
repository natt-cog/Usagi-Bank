# ============================================================
#  うさぎ銀行 勘定系オンライン  application.properties
#  (本番は WebSphere 上で JNDI DataSource を使用. ここは開発用設定)
# ============================================================
spring.application.name=usagi-bank
server.port=8080
server.servlet.context-path=/usagi
server.servlet.session.timeout=1800
server.tomcat.uri-encoding=UTF-8

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- View (JSP) ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.mvc.format.date=yyyy/MM/dd
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.resources.cache.period=3600

# --- DataSource (Oracle 互換モード H2) ---
# 本番: jdbc:oracle:thin:@//usagi-db01:1521/USAGIPRD
spring.datasource.url=jdbc:h2:mem:usagi;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=USAGI
spring.datasource.password=usagi
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# 本番は Oracle 12c (Oracle12cDialect). ローカル/検証は H2 Oracle 互換モードのため H2Dialect を使用
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Cache (Caffeine) ---
spring.cache.type=caffeine
spring.cache.cache-names=branchTotals
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s,recordStats

# --- Security ---
# (security.basic.enabled / security.sessions は Boot 2 以降廃止. SecurityConfig の SecurityFilterChain で制御)

# --- Actuator ---
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.shutdown.access=none
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# --- 業務パラメータ ---
usagi.transfer.daily-limit=1000000
usagi.batch.eod.enabled=true
usagi.batch.eod.cron=0 30 23 * * *

# --- Logging ---
logging.level.root=INFO
logging.level.jp.usagi.bank=DEBUG
logging.level.AUDIT=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy/MM/dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n
