# ============================================================
#  うさぎ銀行 勘定系オンライン  application.properties
#  (本番は WebSphere 上で JNDI DataSource を使用. ここは開発用設定)
# ============================================================
spring.application.name=usagi-bank
server.port=8080
server.context-path=/usagi
server.session.timeout=1800
server.tomcat.uri-encoding=UTF-8

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB

# --- View (JSP) ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.mvc.date-format=yyyy/MM/dd
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.resources.cache-period=3600

# --- DataSource (Oracle 互換モード H2) ---
# 本番: jdbc:oracle:thin:@//usagi-db01:1521/USAGIPRD
spring.datasource.url=jdbc:h2:mem:usagi;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=USAGI
spring.datasource.password=usagi
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.tomcat.max-active=20
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query=SELECT 1 FROM DUAL

# 本番は Oracle 12c (Oracle12cDialect). ローカル/検証は H2 Oracle 互換モードのため H2Dialect を使用
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
spring.jpa.open-in-view=true

flyway.enabled=true
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Cache (Ehcache 2) ---
spring.cache.type=ehcache
spring.cache.ehcache.config=classpath:ehcache.xml

# --- Security ---
security.basic.enabled=false
security.sessions=if_required

# --- Actuator ---
management.context-path=/manage
management.security.enabled=false
endpoints.health.sensitive=false
endpoints.info.enabled=true
endpoints.metrics.enabled=true
endpoints.shutdown.enabled=false
info.app.name=${spring.application.name}
info.app.version=@project.version@

# --- 業務パラメータ ---
usagi.transfer.daily-limit=1000000
usagi.batch.eod.enabled=true
usagi.batch.eod.cron=0 30 23 * * *

# --- Logging ---
logging.level.root=INFO
logging.level.jp.usagi.bank=DEBUG
logging.level.AUDIT=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy/MM/dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n
